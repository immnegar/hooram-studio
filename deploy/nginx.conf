# ==============================================================
# HOORAM STUDIO — PRODUCTION NGINX CONFIGURATION
# Domain: hooramstudio.ir / www.hooramstudio.ir
# Reverse Proxy: Node.js / Express on http://127.0.0.1:5000
# ==============================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name hooramstudio.ir www.hooramstudio.ir;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hooramstudio.ir www.hooramstudio.ir;

    # SSL Certificates (Generated via Certbot)
    ssl_certificate /etc/letsencrypt/live/hooramstudio.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooramstudio.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hooramstudio.ir/chain.pem;

    # SSL Optimization & Modern Security Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size for portfolio images & videos
    client_max_body_size 50M;

    # Gzip Compression for Fast Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Static Assets Caching (Vite hashed bundles in dist/assets)
    location /assets/ {
        alias /var/www/hooram-studio/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public Uploaded Media Caching
    location /uploads/ {
        alias /var/www/hooram-studio/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Let's Encrypt Webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Node.js Application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

